name: Bina Husky Care TWA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Sediakan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sediakan Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle & Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/android-sdk/platforms
            ~/android-sdk/build-tools
            ~/android-sdk/platform-tools
            ~/android-sdk/cmdline-tools
            ~/android-sdk/licenses
          key: gradle-android-sdk-${{ runner.os }}-34-35-v11

      - name: Pasang Android Command-line Tools & SDK
        run: |
          set -e
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
            unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            rm -f cmdline-tools.zip
          fi

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Pasang Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Sediakan Keystore Tandatangan APK
        run: |
          set -e
          KEYSTORE_PASS="${{ secrets.HUSKYCARE_KEYSTORE_PASSWORD || 'huskycare123' }}"
          if [ -n "${{ secrets.HUSKYCARE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.HUSKYCARE_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/android.keystore"
          else
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/android.keystore" \
              -alias huskycarekey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEYSTORE_PASS" \
              -dname "CN=Husky Care, OU=SYM Husky 150, O=Husky Care, L=Melaka, ST=Melaka, C=MY"
          fi
          echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"

      - name: Cipta konfigurasi Bubblewrap & Bina APK
        run: |
          set -e
          SDK_DIR="$HOME/android-sdk"
          JDK_DIR="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(which java))))}"

          mkdir -p "$HOME/.bubblewrap"
          cat <<EOF > "$HOME/.bubblewrap/config.json"
          {
            "jdkPath": "$JDK_DIR",
            "androidSdkPath": "$SDK_DIR"
          }
          EOF

          mkdir -p "$HOME/.gradle"
          cat <<EOF > "$HOME/.gradle/gradle.properties"
          org.gradle.daemon=false
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          org.gradle.console=plain
          EOF

          mkdir -p "$GITHUB_WORKSPACE/twa-project"
          cd "$GITHUB_WORKSPACE/twa-project"

          # Jana PNG 512x512 yang sah
          python3 -c '
          import os, zlib, struct
          out_path = os.path.abspath("icon-512.png")
          w, h = 512, 512
          raw = bytearray()
          for _ in range(h):
              raw.append(0)
              for _ in range(w):
                  raw.extend((0, 31, 63, 255))
          def chunk(tag, body):
              return struct.pack("!I", len(body)) + tag + body + struct.pack("!I", zlib.crc32(tag + body) & 0xffffffff)
          ihdr = struct.pack("!IIBBBBB", w, h, 8, 6, 0, 0, 0)
          idat = zlib.compress(bytes(raw), level=6)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", idat) + chunk(b"IEND", b"")
          with open(out_path, "wb") as f:
              f.write(png)
          print("Generated valid PNG at:", out_path)
          '

          node -e '
            const https = require("https");
            const http = require("http");
            const fs = require("fs");

            const appHost = "kimsoju81.github.io";
            const appBaseUrl = "https://" + appHost + "/Husky-Care";
            const manifestUrl = appBaseUrl + "/manifest.json";
            const localPngUrl = "http://127.0.0.1:18080/icon-512.png";

            function resolveUrl(u) {
              if (!u) return null;
              if (u.startsWith("https://") || u.startsWith("http://")) return u;
              if (u.startsWith("/")) return "https://" + appHost + u;
              return appBaseUrl + "/" + u.replace(/^\.\//, "");
            }

            function checkImageUrl(url) {
              return new Promise((resolve) => {
                if (!url) return resolve(false);
                const client = url.startsWith("http://") ? http : https;
                client.get(url, (r) => {
                  const ct = (r.headers["content-type"] || "").toLowerCase();
                  resolve(r.statusCode >= 200 && r.statusCode < 300 && ct.startsWith("image/"));
                }).on("error", () => resolve(false));
              });
            }

            https.get(manifestUrl, (res) => {
              let webManifest = {};
              if (res.statusCode === 200) {
                let data = "";
                res.on("data", chunk => data += chunk);
                res.on("end", () => {
                  try { webManifest = JSON.parse(data); } catch (_) {}
                  finalizeManifest(webManifest);
                });
              } else {
                finalizeManifest(webManifest);
              }
            }).on("error", () => finalizeManifest({}));

            async function finalizeManifest(webManifest) {
              let existing = {};
              if (fs.existsSync("twa-manifest.json")) {
                try { existing = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8")); } catch (_) {}
              }

              const icons = Array.isArray(webManifest.icons) ? webManifest.icons : [];
              const candidates = [
                ...icons.map(i => resolveUrl(i.src)),
                appBaseUrl + "/icon-512.png",
                appBaseUrl + "/icons/icon-512.png",
                localPngUrl
              ].filter(Boolean);

              let validIconUrl = localPngUrl;
              for (const u of candidates) {
                if (await checkImageUrl(u)) {
                  validIconUrl = u;
                  break;
                }
              }

              const twaManifest = Object.assign({}, existing, {
                packageId: "io.github.kimsoju81.huskycare.twa",
                host: appHost,
                name: webManifest.name || "Husky Care",
                launcherName: webManifest.short_name || "Husky Care",
                display: webManifest.display || "standalone",
                themeColor: webManifest.theme_color || "#001F3F",
                themeColorDark: webManifest.theme_color || "#001F3F",
                navigationColor: webManifest.background_color || "#ffffff",
                navigationColorDark: webManifest.background_color || "#000000",
                navigationDividerColor: "#000000",
                navigationDividerColorDark: "#000000",
                backgroundColor: webManifest.background_color || "#ffffff",
                enableNotifications: false,
                startUrl: "/Husky-Care/",
                iconUrl: validIconUrl,
                maskableIconUrl: validIconUrl,
                splashScreenFadeOutDuration: 300,
                signingKey: {
                  path: process.env.GITHUB_WORKSPACE + "/android.keystore",
                  alias: "huskycarekey"
                },
                appVersionName: "1.0.0",
                appVersionCode: 1,
                shortcuts: [],
                generatorApp: "bubblewrap-cli",
                webManifestUrl: manifestUrl,
                fallbackType: "customtabs",
                features: {},
                alphaDependencies: { enabled: false },
                enableSiteSettingsShortcut: true,
                isChromeOSOnly: false,
                isMetaQuest: false,
                fullScopeUrl: appBaseUrl + "/",
                minSdkVersion: 21,
                orientation: webManifest.orientation || "default",
                fingerprints: existing.fingerprints || [],
                additionalTrustedOrigins: [],
                retainedHashes: existing.retainedHashes || []
              });

              fs.writeFileSync("twa-manifest.json", JSON.stringify(twaManifest, null, 2));
              console.log("Generated twa-manifest.json with image iconUrl:", validIconUrl);
            }
          '

          export BUBBLEWRAP_KEYSTORE_PASSWORD="$KEYSTORE_PASS"
          export BUBBLEWRAP_KEY_PASSWORD="$KEYSTORE_PASS"

          python3 -m http.server 18080 --directory "$GITHUB_WORKSPACE/twa-project" >/dev/null 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          if [ ! -f "build.gradle" ] && [ ! -f "app/build.gradle" ]; then
            echo "Menjana projek awal dengan bubblewrap init..."
            printf "kimsoju81.github.io\n/Husky-Care/\n1.0.0\n1\n\n\n\n\n\n\n\n\n" | bubblewrap init --manifest="https://kimsoju81.github.io/Husky-Care/manifest.json" --skipPwaValidation || true
          fi

          echo "Menjalankan bubblewrap update..."
          printf "1.0.0\n1.0.0\n1.0.0\n" | bubblewrap update --skipPwaValidation

          kill $SERVER_PID 2>/dev/null || true

          echo "Menjalankan bubblewrap build..."
          if ! printf "%s\n%s\n%s\n%s\n" "$KEYSTORE_PASS" "$KEYSTORE_PASS" "$KEYSTORE_PASS" "$KEYSTORE_PASS" | bubblewrap build --skipPwaValidation; then
            echo "Bubblewrap build gagal pada semakan SDK; membina APK terus melalui Gradle..."
            if [ -x "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew assembleRelease --no-daemon
              UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
              APKSIGNER=$(find "$SDK_DIR/build-tools" -name "apksigner" | sort -V | tail -n 1)
              ZIPALIGN=$(find "$SDK_DIR/build-tools" -name "zipalign" | sort -V | tail -n 1)
              if [ -n "$UNSIGNED_APK" ] && [ -n "$APKSIGNER" ] && [ -n "$ZIPALIGN" ]; then
                ALIGNED_APK="app/build/outputs/apk/release/husky-care-aligned.apk"
                SIGNED_APK="app/build/outputs/apk/release/husky-care-signed.apk"
                "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
                "$APKSIGNER" sign --ks "$GITHUB_WORKSPACE/android.keystore" --ks-key-alias huskycarekey --ks-pass "pass:$KEYSTORE_PASS" --key-pass "pass:$KEYSTORE_PASS" --out "$SIGNED_APK" "$ALIGNED_APK"
                echo "Berjaya menjana APK bertandatangan: $SIGNED_APK"
              fi
            else
              exit 1
            fi
          fi

      - name: Muat Naik Fail APK sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Husky-Care-TWA-APK
          path: twa-project/**/*.apk
